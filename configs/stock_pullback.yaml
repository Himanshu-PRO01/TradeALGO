# Stock Pullback Strategy: Mean-reversion on high-liquidity Nifty heavyweights
# (Reliance, HDFC Bank, ICICI Bank). Exploits intraday overextensions aligned with 50-EMA trend.
name: stock_pullback
capital: 100000

data:
  path: qa/realistic_nifty_5min.csv

strategy:
  name: rules
  params:
    indicators:
      - {name: rsi5, type: rsi, period: 5}
      - {name: e20,  type: ema, period: 20}
      - {name: e50,  type: ema, period: 50}
    entry_long:  "rsi5 < 25 and close > open and close > e50"
    exit_long:   "rsi5 > 60"
    entry_short: "rsi5 > 75 and close < open and close < e50"
    exit_short:  "rsi5 < 40"
  quantity: 100
  allow_short: true
  stop_loss_pct: 0.35
  target_pct: 0.75

risk:
  max_daily_loss: 2000
  max_trades_per_day: 2
  max_position_value: 250000
  trading_start: "09:30"
  no_new_entries_after: "14:15"
  square_off_time: "15:15"

costs:
  brokerage_pct: 0.03
  brokerage_cap: 20
  stt_sell_pct: 0.025
  exchange_txn_pct: 0.003
  sebi_fee_pct: 0.0001
  stamp_buy_pct: 0.003
  gst_pct: 18
  slippage_bps: 2
