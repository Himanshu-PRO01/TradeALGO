name: Autonomous 90-Day Paper Trading Audit Logger

on:
  schedule:
    # 10:15 UTC = 15:45 IST (Mon-Fri) right after Indian Market closes
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Allows one-click manual test run from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-audit-logger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Multi-Asset Paper Trading Audit
        run: |
          python run_90day_logger.py --multi-asset --once

      - name: Commit & Push Daily Audit Ledger
        run: |
          git config --global user.name "TradeALGO Audit Bot"
          git config --global user.email "bot@tradealgo.local"
          git add -f audit_logs/ paper_trades.db
          git diff --staged --quiet || git commit -m "chore: record daily 90-day paper trading audit [skip ci]"
          git push
