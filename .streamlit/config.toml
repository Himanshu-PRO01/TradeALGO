# A dark, trading-desk look. Nothing here is secret; it only sets colours and behaviour.
[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#070B11"
secondaryBackgroundColor = "#0E1522"
textColor = "#F1F5F9"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
